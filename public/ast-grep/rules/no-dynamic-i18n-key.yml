id: no-dynamic-i18n-key-localize
language: TypeScript
severity: error
message: 'Write the `$localize` message ID (`@@id`) as a static literal; an ID assembled at runtime leaves no way to tell whether a catalog entry is still in use.'
rule:
  kind: template_string
  regex: '^`:[^:]*@@[^:]*\$\{'
  inside:
    kind: call_expression
    has:
      field: function
      regex: '^\$localize$'
---
id: no-dynamic-i18n-key-vue-text
language: Html
severity: error
files:
  - '*.vue'
message: 'Pass the translation key to `t()` as an inline string literal; a key assembled at runtime or held in a variable leaves no way to tell whether a catalog entry is still in use.'
rule:
  kind: text
  regex: '\{\{[^}]*(^|[^\w$.])t\(\s*([^''"`\s]|`[^`]*\$\{)'
---
id: no-dynamic-i18n-key-vue-attr
language: Html
severity: error
files:
  - '*.vue'
message: 'Pass the translation key to `t()` as an inline string literal; a key assembled at runtime or held in a variable leaves no way to tell whether a catalog entry is still in use.'
rule:
  kind: quoted_attribute_value
  regex: '(^|[^\w$.])t\(\s*([^''"`\s]|`[^`]*\$\{)'
  inside:
    kind: attribute
    has:
      kind: attribute_name
      regex: '^([:@#]|v-)'
