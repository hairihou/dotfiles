id: curly-if-ts
language: TypeScript
severity: warning
message: "Wrap the `if` body in braces."
rule:
  all:
    - pattern: if ($COND) $STMT
    - not:
        has:
          field: alternative
          pattern: $_
constraints:
  STMT:
    not:
      kind: statement_block
fix: "if ($COND) { $STMT }"
