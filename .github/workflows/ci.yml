name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      MISE_CONFIG_FILE: ${{ github.workspace }}/src/.config/mise/config.toml
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
