set -s extended-keys on
set -as terminal-features "xterm*:extkeys:hyperlinks"
set -gw automatic-rename-format "#{b:pane_current_path}"
set -gw mode-keys vi
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g pane-border-format "#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host}}}, #{pane_title} ,}"
set -g pane-border-status top

set -g base-index 1
set -gw pane-base-index 1
set -g renumber-windows on

bind -N "Split window horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split window vertically" - split-window -v -c "#{pane_current_path}"
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

bind -N "Show agent overview" a display-popup -w 40% -h 40% -E tmux-agentview.py

bind -N "Kill the active pane without confirmation" x kill-pane
bind -N "Kill current window without confirmation" & kill-window

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

source-file ~/.config/tmux/themes/nocturne.conf
