set -g pane-border-style "fg=#6a7282"
set -g pane-active-border-style "#{?#{&&:#{==:#{window_panes},1},#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},}}},fg=#101828,fg=#99a1af}"
set -g mode-style "fg=default,bg=#364153"
