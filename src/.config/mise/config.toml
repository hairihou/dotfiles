[bootstrap.macos.defaults.NSGlobalDomain]
ApplePressAndHoldEnabled = false
AppleShowAllExtensions = true
"com.apple.sound.uiaudio.enabled" = 0
"com.apple.trackpad.scaling" = 3.0
InitialKeyRepeat = 15
KeyRepeat = 2

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
orientation = "left"
"show-recents" = false

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.finder"]
FXRemoveOldTrashItems = true

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0

[bootstrap.macos.defaults."com.apple.screencapture"]
name = "ss"

[dotfiles]
"~/.claude" = { source = "~/dotfiles/src/.claude", mode = "symlink-each", exclude = [
  "__pycache__",
  ".ruff_cache",
] }
"~/.config" = { source = "~/dotfiles/src/.config", mode = "symlink-each", exclude = [
  "__pycache__",
  ".ruff_cache",
] }
"~/.hushlogin" = { source = "~/dotfiles/src/.hushlogin" }
"~/.npmrc" = { source = "~/dotfiles/src/.npmrc" }
"~/.zshrc" = { source = "~/dotfiles/src/.zshrc" }

[settings]
github.use_git_credentials = true
minimum_release_age_excludes = ["claude-code"]

[tools]
age = "1.3.2"
ast-grep = "0.51.0"
aube = "2.8.1"
carapace = "1.8.1"
claude-code = { version = "latest", auto_update = true }
fnox = "1.42.0"
fzf = "0.74.5"
gh = "2.103.0"
ghq = "1.11.2"
go = "1.27.3"
hk = "2.8.0"
neovim = "0.12.6"
node = "24.22.1"
"npm:@angular/cli" = "22.2.3"
"npm:@earendil-works/pi-coding-agent" = "1.3.0"
"npm:@ionic/cli" = "7.2.1"
"npm:@playwright/cli" = "0.1.22"
"npm:agent-browser" = "0.39.1"
"npm:oxfmt" = "0.74.0"
"pipx:git+https://github.com/github/spec-kit.git" = "v1.2.3"
pnpm = "12.14.0"
ripgrep = "15.2.0"
ruff = "0.17.2"
swiftlint = "0.65.1"
tmux = "3.7c"
tree-sitter = "0.27.1"
uv = "0.13.5"
xh = "0.26.3"
zoxide = "0.10.0"
