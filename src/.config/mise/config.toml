[bootstrap.macos.defaults.NSGlobalDomain]
ApplePressAndHoldEnabled = false
AppleShowAllExtensions = true
"com.apple.sound.uiaudio.enabled" = 0
"com.apple.trackpad.scaling" = 3.0
InitialKeyRepeat = 15
KeyRepeat = 2
NSRecentDocumentsLimit = 0

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
orientation = "left"
"show-recents" = false
"wvous-br-corner" = 1

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.finder"]
FXRemoveOldTrashItems = true

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0

[bootstrap.macos.defaults."com.apple.screencapture"]
name = "ss"

[dotfiles]
"~/.claude" = { source = "~/dotfiles/src/.claude", mode = "symlink-each" }
"~/.config" = { source = "~/dotfiles/src/.config", mode = "symlink-each" }
"~/.hushlogin" = { source = "~/dotfiles/src/.hushlogin" }
"~/.npmrc" = { source = "~/dotfiles/src/.npmrc" }
"~/.zshrc" = { source = "~/dotfiles/src/.zshrc" }

[settings]
github.use_git_credentials = true
minimum_release_age_excludes = ["claude-code"]

[tools]
age = "1.3.2"
ast-grep = "0.51.1"
aube = "2.9.0"
carapace = { version = "latest", auto_update = true }
claude-code = { version = "latest", auto_update = true }
fnox = { version = "latest", auto_update = true }
fzf = { version = "latest", auto_update = true }
gh = { version = "latest", auto_update = true }
ghq = { version = "latest", auto_update = true }
go = "1.27.3"
hk = "2.11.1"
neovim = { version = "latest", auto_update = true }
node = "26.13.0"
"npm:@angular/cli" = "22.2.5"
"npm:@earendil-works/pi-coding-agent" = { version = "latest", auto_update = true }
"npm:@ionic/cli" = "7.2.1"
"npm:@playwright/cli" = "0.1.23"
"npm:agent-browser" = "0.41.1"
"npm:oxfmt" = "0.75.0"
pnpm = "12.16.1"
ripgrep = { version = "latest", auto_update = true }
swiftlint = "0.65.1"
tmux = "3.7c"
tree-sitter = "0.27.1"
uv = "0.13.7"
xh = { version = "latest", auto_update = true }
zoxide = { version = "latest", auto_update = true }
