[bootstrap.macos.defaults.NSGlobalDomain]
ApplePressAndHoldEnabled = false
AppleShowAllExtensions = true
"com.apple.sound.uiaudio.enabled" = 0
"com.apple.trackpad.scaling" = 3.0
InitialKeyRepeat = 15
KeyRepeat = 2
NSRecentDocumentsLimit = 0

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
orientation = "left"
"show-recents" = false
"wvous-br-corner" = 1

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
ActuationStrength = 0

[bootstrap.macos.defaults."com.apple.finder"]
FXRemoveOldTrashItems = true

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0

[bootstrap.macos.defaults."com.apple.screencapture"]
name = "ss"

[dotfiles]
"~/.claude" = { source = "~/dotfiles/src/.claude", mode = "symlink-each" }
"~/.config" = { source = "~/dotfiles/src/.config", mode = "symlink-each" }
"~/.hushlogin" = { source = "~/dotfiles/src/.hushlogin" }
"~/.npmrc" = { source = "~/dotfiles/src/.npmrc" }
"~/.zshrc" = { source = "~/dotfiles/src/.zshrc" }

[settings]
github.use_git_credentials = true
minimum_release_age_excludes = ["claude-code"]
tool_update.global_auto = true

[tools]
age = "1.3.2"
ast-grep = "0.51.2"
aube = { version = "2.10.0", workflow = [
  "release-plz.yml@refs/heads/main",
  "release.yml@refs/heads/main",
] }
carapace = "latest"
claude-code = "latest"
fnox = { version = "latest", workflow = "release.yml" }
fzf = "latest"
gh = "latest"
ghq = "latest"
go = "1.27.4"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"go:golang.org/x/tools/gopls" = "0.24.0"
golangci-lint = "2.15.0"
hk = { version = "2.12.0", workflow = "release.yml" }
neovim = "latest"
node = "26.13.1"
"npm:@angular/cli" = "22.2.6"
"npm:@ionic/cli" = "7.2.1"
"npm:@playwright/cli" = "0.1.24"
"npm:agent-browser" = "0.42.0"
"npm:oxfmt" = "0.78.0"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.3"
pnpm = "12.18.0"
ripgrep = "latest"
rust-analyzer = "2026-11-09"
swiftlint = "0.65.1"
tmux = "3.8"
tree-sitter = "0.27.2"
uv = "0.13.8"
xh = "latest"
zoxide = "latest"
